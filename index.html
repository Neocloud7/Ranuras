<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ranuras</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a9aec6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ranuras">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a3d52; --bg1:#b4b9d0; --bg2:#9ea3bd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    touch-action:none; user-select:none; -webkit-user-select:none; background:var(--bg2); }
  body { background:linear-gradient(var(--bg1),var(--bg2)); transition:background .6s; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.show { display:flex; animation:fade .25s; }
  @keyframes fade { from{opacity:0} }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 0; gap:6px; min-height:56px; }
  .btn { border:0; background:#3a3d52; color:#fff; font:600 16px 'Fredoka',sans-serif; border-radius:14px; height:44px; min-width:44px; padding:0 12px;
    box-shadow:0 4px 0 #23253a; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; position:relative; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #23253a; }
  .btn.light { background:#eef0f8; color:var(--ink); box-shadow:0 4px 0 #8b90aa; }
  .btn.light:active { box-shadow:0 1px 0 #8b90aa; }
  .btn.go { background:#55c41b; box-shadow:0 5px 0 #2f8a0a; font-size:20px; height:54px; padding:0 28px; }
  .btn.go:active { box-shadow:0 2px 0 #2f8a0a; }
  .btn.pink { background:#ff4fa3; box-shadow:0 5px 0 #c22a73; }
  .btn.gold { background:#ffc21a; color:#5a3d00; box-shadow:0 5px 0 #d98a00; }
  .btn.sm { height:36px; font-size:14px; padding:0 10px; border-radius:12px; }
  .btn[disabled] { opacity:.4; }
  .badge { position:absolute; top:-6px; right:-6px; background:#ff4fa3; color:#fff; font-size:12px; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px; box-shadow:0 2px 0 #c22a73; }
  .hgroup { display:flex; gap:6px; }
  #gTitle { text-align:center; line-height:1; flex:1; min-width:0; }
  #gTitle .lv { font-size:24px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #gSub { text-align:center; font-size:15px; font-weight:600; margin-top:8px; min-height:26px; }
  #gSub span { background:rgba(255,255,255,.45); padding:4px 14px; border-radius:20px; }
  #gSub.warn span { color:#fff; background:#f2384a; }
  #timebar { height:10px; margin:8px 16px 0; border-radius:6px; background:rgba(255,255,255,.4); overflow:hidden; display:none; }
  #timebar div { height:100%; width:100%; background:linear-gradient(90deg,#55c41b,#a8f05a); border-radius:6px; }
  #timebar.low div { background:linear-gradient(90deg,#f2384a,#ff7d88); }
  #stage { flex:1; position:relative; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:15px; font-weight:500; opacity:.85; pointer-events:none; padding:0 20px; }
  #skipPill { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); display:none; z-index:2; }
  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); font:700 34px 'Fredoka',sans-serif; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25); pointer-events:none; animation:toast 1s forwards; z-index:30; white-space:nowrap; }
  @keyframes toast { 0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)} 70%{opacity:1} 100%{opacity:0; transform:translate(-50%,-90%)} }
  .achToast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 12px); transform:translateX(-50%); background:#3a3d52; color:#fff; padding:10px 18px; border-radius:16px; font-size:16px; z-index:40;
    box-shadow:0 5px 0 #23253a; animation:achIn 2.8s forwards; white-space:nowrap; pointer-events:none; }
  .achToast b { color:#ffc21a; }
  @keyframes achIn { 0%{ transform:translate(-50%,-120%); } 10%,85%{ transform:translate(-50%,0); } 100%{ transform:translate(-50%,-140%); } }
  .coins { display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.55); padding:5px 12px; border-radius:20px; font-weight:700; font-size:17px; }

  /* inicio */
  #home { align-items:center; overflow-y:auto; touch-action:pan-y; }
  .topbar { width:100%; display:flex; justify-content:space-between; align-items:center; padding:12px 16px 0; }
  .logo { margin:18px 0 4px; display:flex; gap:3px; }
  .logo span { font:700 44px 'Fredoka',sans-serif; color:#fff; width:44px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.18); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50%{ transform:translateY(-6px) } }
  .tagline { font-size:16px; opacity:.75; margin-bottom:14px; }
  #bPlay { min-width:250px; flex-direction:column; height:74px; line-height:1.05; }
  #bPlay small { font-size:14px; opacity:.85; font-weight:500; }
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(380px,92vw); margin:20px 0 12px; }
  .mode { border:0; border-radius:20px; padding:14px 10px 12px; color:#fff; font:600 17px 'Fredoka',sans-serif; text-align:center; cursor:pointer; position:relative; min-height:108px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .mode:active { transform:translateY(3px); }
  .mode .ic { font-size:30px; line-height:1; }
  .mode small { font-size:12.5px; font-weight:500; opacity:.92; }
  .mode.locked { filter:grayscale(1) brightness(1.1); opacity:.65; }
  .homefoot { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(380px,92vw); margin:4px 0 26px; }
  .homefoot .btn { flex-direction:column; height:64px; font-size:13px; gap:2px; }
  .homefoot .btn span { font-size:22px; }

  /* listas */
  .listwrap { flex:1; overflow-y:auto; padding:10px 14px 30px; touch-action:pan-y; }
  .hdrTitle { font-size:24px; font-weight:700; flex:1; text-align:center; }
  .world { border-radius:20px; padding:14px 16px; margin-bottom:12px; color:#fff; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.18); }
  .world .wn { font-size:13px; opacity:.88; }
  .world .wt { font-size:22px; font-weight:700; }
  .world .wm { font-size:13px; opacity:.95; margin-top:2px; }
  .world .wbar { height:8px; background:rgba(255,255,255,.35); border-radius:4px; margin-top:6px; overflow:hidden; }
  .world .wbar div { height:100%; background:#fff; }
  .world .ws { margin-left:auto; text-align:right; font-weight:600; white-space:nowrap; }
  .world.locked { filter:grayscale(.9); opacity:.6; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .grid button { aspect-ratio:1; border:0; border-radius:14px; font:700 19px 'Fredoka',sans-serif; background:#ff4fa3; color:#fff; box-shadow:0 4px 0 #c22a73; cursor:pointer; position:relative; padding:0; }
  .grid button.done { background:#55c41b; box-shadow:0 4px 0 #2f8a0a; }
  .grid button.skipped { background:#8b90aa; box-shadow:0 4px 0 #5d6178; }
  .grid button.cur { outline:3px solid #fff; outline-offset:2px; }
  .grid button.locked { background:#c9ccdb; box-shadow:0 4px 0 #9a9eb6; color:#8e92ab; }
  .grid button small { position:absolute; bottom:2px; left:0; right:0; font-size:10px; letter-spacing:1px; color:#ffe680; }
  .dcard { background:#f4f5fb; border-radius:20px; padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; box-shadow:0 5px 0 #8b90aa; cursor:pointer; }
  .dcard .dn { font-size:19px; font-weight:700; }
  .dcard .dd { font-size:14px; opacity:.7; }
  .dcard .chk { margin-left:auto; font-size:26px; white-space:nowrap; }
  .dcard.dim { opacity:.55; }
  .bigstat { text-align:center; margin:6px 0 16px; font-size:17px; }
  .bigstat b { font-size:40px; display:block; line-height:1.1; }
  .tabs { display:flex; gap:8px; justify-content:center; margin:6px 0 14px; }
  .tabs button { border:0; border-radius:14px; padding:8px 16px; font:600 16px 'Fredoka',sans-serif; background:rgba(255,255,255,.45); color:var(--ink); }
  .tabs button.on { background:#3a3d52; color:#fff; }
  .statrow { display:flex; justify-content:space-between; padding:12px 6px; border-bottom:1px solid rgba(0,0,0,.08); font-size:17px; }
  .statrow b { font-weight:700; }
  .skinprev { width:72px; height:48px; border-radius:10px; flex:none; }

  /* editor */
  #edTools { display:none; padding:6px 8px 10px; }
  #game.editing #edTools { display:block; }
  #game.editing .playonly { display:none !important; }
  #game:not(.editing) .editonly { display:none !important; }
  .edrow { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .edrow.tl { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .tool { border:0; border-radius:12px; min-width:0; height:44px; font:600 11px 'Fredoka',sans-serif; background:#eef0f8; color:var(--ink); box-shadow:0 3px 0 #8b90aa; padding:0 2px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .tool span { font-size:17px; }
  .tool.on { background:#3a3d52; color:#fff; box-shadow:0 3px 0 #23253a; }
  .swatch { width:32px; height:32px; border-radius:10px; border:3px solid transparent; box-shadow:0 3px 0 rgba(0,0,0,.2); }
  .swatch.on { border-color:#fff; outline:2px solid #3a3d52; }
  .sizebox { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.5); border-radius:12px; padding:2px 6px; font-weight:600; font-size:14px; }
  .sizebox button { border:0; background:#3a3d52; color:#fff; width:26px; height:26px; border-radius:8px; font-size:16px; }

  /* modales */
  .overlay { position:fixed; inset:0; background:rgba(40,42,60,.55); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .overlay.show { display:flex; animation:fade .25s; }
  .card { background:#f4f5fb; border-radius:26px; padding:24px 20px 20px; text-align:center; width:min(360px,100%); box-shadow:0 10px 0 #7d829e; animation:pop .35s cubic-bezier(.2,1.6,.4,1); max-height:90vh; overflow:auto; touch-action:pan-y; }
  @keyframes pop { from{transform:scale(.7)} }
  .card h2 { margin:0 0 6px; font-size:29px; }
  .card p { margin:4px 0 16px; font-size:17px; opacity:.88; line-height:1.35; }
  .card .ic { font-size:56px; margin-bottom:4px; line-height:1.1; }
  .card .btns { display:flex; flex-direction:column; gap:12px; align-items:center; }
  .stars { font-size:44px; letter-spacing:6px; margin:4px 0 8px; }
  .stars span { color:#c9ccdb; display:inline-block; }
  .stars span.on { color:#ffc21a; text-shadow:0 3px 0 #d98a00; animation:star .5s backwards; }
  @keyframes star { from{transform:scale(0) rotate(-90deg)} }
  .chest { font-size:90px; display:inline-block; animation:shakeC .5s 3; }
  @keyframes shakeC { 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
  .toggle { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; font-size:18px; border-bottom:1px solid #dde0ec; }
  .toggle button { width:60px; height:34px; border-radius:17px; border:0; background:#c9ccdb; position:relative; cursor:pointer; }
  .toggle button::after { content:''; position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:13px; background:#fff; transition:left .2s; }
  .toggle button.on { background:#55c41b; }
  .toggle button.on::after { left:30px; }
  .mech { width:120px; height:90px; margin:0 auto 6px; display:block; }
</style>
</head>
<body>

<!-- INICIO -->
<div class="screen" id="home">
  <div class="topbar"><span class="coins" id="homeCoins">🪙 0</span><span class="coins" id="homeStars">★ 0</span></div>
  <div class="logo" id="logo"></div>
  <div class="tagline">Cada bloque, por su ranura</div>
  <button class="btn go" id="bPlay"><span id="playL1">Jugar</span><small id="playL2"></small></button>
  <div class="modes" id="modes"></div>
  <div class="homefoot">
    <button class="btn light" id="bWorlds"><span>🗺️</span>Mundos</button>
    <button class="btn light" id="bShop"><span>🛍️</span>Tienda</button>
    <button class="btn light" id="bAch"><span>🏆</span>Logros</button>
    <button class="btn light" id="bEditor"><span>🛠️</span>Editor</button>
    <button class="btn light" id="bStats"><span>📊</span>Estadísticas</button>
    <button class="btn light" id="bSettings"><span>⚙️</span>Ajustes</button>
  </div>
</div>

<!-- MUNDOS -->
<div class="screen" id="worlds">
  <header><button class="btn light" data-back="home">‹</button><div class="hdrTitle">Mundos</div><div style="width:44px"></div></header>
  <div class="listwrap" id="worldList"></div>
</div>

<!-- NIVELES -->
<div class="screen" id="levels">
  <header><button class="btn light" id="levelsBack">‹</button><div class="hdrTitle" id="levelsTitle"></div><div style="width:44px"></div></header>
  <div class="listwrap"><div class="bigstat" id="levelsStat"></div><div class="grid" id="levelGrid"></div></div>
</div>

<!-- LISTA GENÉRICA (reto diario, tienda, logros, estadísticas, mis niveles) -->
<div class="screen" id="list">
  <header><button class="btn light" id="listBack">‹</button><div class="hdrTitle" id="listTitle"></div><span class="coins" id="listCoins" style="font-size:15px">🪙 0</span></header>
  <div class="listwrap" id="listBody"></div>
</div>

<!-- JUEGO / EDITOR -->
<div class="screen" id="game">
  <header>
    <button class="btn light" id="gBack" aria-label="Salir">‹</button>
    <div id="gTitle"><div class="lv"></div></div>
    <div class="hgroup playonly">
      <button class="btn light" id="bHint" aria-label="Pista">💡<span class="badge" id="hintBadge">3</span></button>
      <button class="btn light" id="bUndo" aria-label="Deshacer">↶</button>
      <button class="btn light" id="bReset" aria-label="Reiniciar">⟲</button>
    </div>
    <div class="hgroup editonly">
      <button class="btn light" id="edCheck" aria-label="Comprobar">✔︎</button>
      <button class="btn light" id="edPlay" aria-label="Probar">▶</button>
      <button class="btn go sm" id="edSave" style="height:44px">Guardar</button>
    </div>
  </header>
  <div id="gSub" class="playonly"></div>
  <div id="timebar" class="playonly"><div></div></div>
  <div id="stage"><canvas id="cv"></canvas><div id="hint" class="playonly"></div><button class="btn gold sm playonly" id="skipPill">⏭ Saltar nivel · 150 🪙</button></div>
  <div id="edTools"></div>
</div>

<div class="overlay" id="modal"><div class="card" id="modalCard"></div></div>

  const a = Math.floor(ranges[slot][0] * NLV), z = Math.max(a + 1, Math.floor(ranges[slot][1] * NLV));

}

}
function edBlockAt(c) { return c ? E.L.blocks.findIndex(b => c.x >= b.x && c.x < b.x + b.w && c.y >= b.y && c.y < b.y + b.h) : -1; }

}
function edDown(e) {

  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
}
function edMove(e) { if (!E || !E.drag || e.pointerId !== E.drag.id) return; const p = toBoard(e); E.drag.cur = edCellAt(p) || E.drag.cur; const ed = edEdgeAt(p); if (ed && E.drag.edge && ed.s === E.drag.edge.s) E.drag.curEdge = ed; }

  const cycle = (v, list) => list[(list.indexOf(v) + 1) % list.length];

      const x0 = Math.min(c.x, d.cur.x), y0 = Math.min(c.y, d.cur.y), w = Math.min(3, Math.abs(d.cur.x - c.x) + 1), h = Math.min(3, Math.abs(d.cur.y - c.y) + 1);
      const x = c.x <= d.cur.x ? c.x : c.x - w + 1, y = c.y <= d.cur.y ? c.y : c.y - h + 1;

  } else if (t === 'paint' && c) {
    const pi = Lv.paints.findIndex(w => w[0] === c.x && w[1] === c.y);

    else if (pi >= 0) Lv.paints[pi][2] = col;
    else if (!Lv.walls.some(w => w[0] === c.x && w[1] === c.y) && !Lv.holes.some(w => w[0] === c.x && w[1] === c.y)) Lv.paints.push([c.x, c.y, col]);

}
function drawEditorOverlay(c) {

  for (let y = 1; y < L.h; y++) { c.beginPath(); c.moveTo(ox, oy + y * cell); c.lineTo(ox + L.w * cell, oy + y * cell); c.stroke(); }
  if (E && E.drag && E.tool === 'piece' && E.drag.start && E.drag.cur && edBlockAt(E.drag.start) < 0) {
    const a = E.drag.start, b = E.drag.cur, w = Math.min(3, Math.abs(b.x - a.x) + 1), h = Math.min(3, Math.abs(b.y - a.y) + 1);

function edValidate() {

    const cols = [b.c].concat(b.c2 !== null && b.c2 !== undefined ? [b.c2] : []);

}
function edSolve() {
  const err = edValidate(); if (err) { showModal({ icon: '🤔', title: 'Falta algo', text: err, buttons: [{ label: 'Vale', cls: 'go' }] }); return null; }
  const r = Solver(clone(E.L)).solve(40000, 8);
  if (!r.ok) { showModal({ icon: '😵', title: 'Sin solución', text: 'No encuentro una forma de sacar todas las piezas (o es demasiado larga para comprobarla).', buttons: [{ label: 'Seguir editando', cls: 'go' }] }); return null; }
  return E.L.blocks.length + r.repos;

$('edCheck').onclick = () => { sfx.click(); const par = edSolve(); if (par) { sfx.win(); showModal({ icon: '✅', title: '¡Tiene solución!', text: 'Mínimo: <b>' + par + '</b> movimientos.', buttons: [{ label: 'Genial', cls: 'go' }] }); } };
$('edPlay').onclick = () => {
  sfx.click(); const par = edSolve(); if (!par) return;
  const lv = Object.assign(clone(E.L), { par, d: 0 }), saved = clone(E);
  startGame(lv, { mode: 'custom', level: lv, title: 'Prueba', theme: 9, onExit: () => { E = saved; G = { mode: 'edit', title: 'Editor', onExit: openMyLevels }; show('game'); $('game').classList.add('editing'); renderEdTools(); edRefresh(true); },
    onWin: alive => setTimeout(() => { if (!alive()) return; sfx.win(); confetti(); showModal({ icon: '🧩', title: '¡Funciona!', text: moves + ' movimientos (mínimo ' + par + ')', buttons: [{ label: 'Volver al editor', cls: 'go', fn: () => G.onExit() }] }); }, 550) });
};
