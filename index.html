<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ranuras</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a9aec6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ranuras">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a3d52; --bg1:#b4b9d0; --bg2:#9ea3bd; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; font-family:'Fredoka',system-ui,sans-serif; color:var(--ink);
    touch-action:none; user-select:none; -webkit-user-select:none; background:var(--bg2); }
  body { background:linear-gradient(var(--bg1),var(--bg2)); transition:background .6s; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.show { display:flex; animation:fade .25s; }
  @keyframes fade { from{opacity:0} }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 12px 0; gap:6px; min-height:56px; }
  .btn { border:0; background:#3a3d52; color:#fff; font:600 16px 'Fredoka',sans-serif; border-radius:14px; height:44px; min-width:44px; padding:0 12px;
    box-shadow:0 4px 0 #23253a; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; position:relative; }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #23253a; }
  .btn.light { background:#eef0f8; color:var(--ink); box-shadow:0 4px 0 #8b90aa; }
  .btn.light:active { box-shadow:0 1px 0 #8b90aa; }
  .btn.go { background:#55c41b; box-shadow:0 5px 0 #2f8a0a; font-size:20px; height:54px; padding:0 28px; }
  .btn.go:active { box-shadow:0 2px 0 #2f8a0a; }
  .btn.pink { background:#ff4fa3; box-shadow:0 5px 0 #c22a73; }
  .btn.gold { background:#ffc21a; color:#5a3d00; box-shadow:0 5px 0 #d98a00; }
  .btn.sm { height:36px; font-size:14px; padding:0 10px; border-radius:12px; }
  .btn[disabled] { opacity:.4; }
  .badge { position:absolute; top:-6px; right:-6px; background:#ff4fa3; color:#fff; font-size:12px; min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0 5px; box-shadow:0 2px 0 #c22a73; }
  .hgroup { display:flex; gap:6px; }
  #gTitle { text-align:center; line-height:1; flex:1; min-width:0; }
  #gTitle .lv { font-size:24px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #gSub { text-align:center; font-size:15px; font-weight:600; margin-top:8px; min-height:26px; }
  #gSub span { background:rgba(255,255,255,.45); padding:4px 14px; border-radius:20px; }
  #gSub.warn span { color:#fff; background:#f2384a; }
  #timebar { height:10px; margin:8px 16px 0; border-radius:6px; background:rgba(255,255,255,.4); overflow:hidden; display:none; }
  #timebar div { height:100%; width:100%; background:linear-gradient(90deg,#55c41b,#a8f05a); border-radius:6px; }
  #timebar.low div { background:linear-gradient(90deg,#f2384a,#ff7d88); }
  #stage { flex:1; position:relative; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:15px; font-weight:500; opacity:.85; pointer-events:none; padding:0 20px; }
  .mode.wide { grid-column:span 2; min-height:96px; flex-direction:row; gap:10px; }
  .mode.wide .ic { font-size:24px; width:44px; height:44px; flex:none; }
  #starChest { display:none; flex:none; margin-top:10px; animation:pulse 1.2s ease-in-out infinite; }
  .code { font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; background:#e6e8f2; border-radius:12px; padding:10px; max-height:120px; overflow:auto; text-align:left; user-select:text; -webkit-user-select:text; touch-action:pan-y; }
  textarea.code { width:100%; height:110px; border:0; resize:none; }
  .deadmsg { display:inline-block; background:#f2384a; color:#fff; padding:6px 14px; border-radius:16px; font-weight:600; font-size:14px; opacity:1; }
  #hint:has(.deadmsg) { opacity:1; }
  .btn.pulse { animation:pulse 0.9s ease-in-out infinite; background:#ffc21a; }
  @keyframes pulse { 50%{ transform:scale(1.12); } }
  #skipPill { position:absolute; left:50%; bottom:6px; transform:translateX(-50%); display:none; z-index:2; }
  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); font:700 34px 'Fredoka',sans-serif; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25); pointer-events:none; animation:toast 1s forwards; z-index:30; white-space:nowrap; }
  @keyframes toast { 0%{opacity:0; transform:translate(-50%,-30%) scale(.6)} 20%{opacity:1; transform:translate(-50%,-50%) scale(1.1)} 70%{opacity:1} 100%{opacity:0; transform:translate(-50%,-90%)} }
  .achToast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 12px); transform:translateX(-50%); background:#3a3d52; color:#fff; padding:10px 18px; border-radius:16px; font-size:16px; z-index:40;
    box-shadow:0 5px 0 #23253a; animation:achIn 2.8s forwards; white-space:nowrap; pointer-events:none; }
  .achToast b { color:#ffc21a; }
  @keyframes achIn { 0%{ transform:translate(-50%,-120%); } 10%,85%{ transform:translate(-50%,0); } 100%{ transform:translate(-50%,-140%); } }
  .coins { display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.55); padding:5px 12px; border-radius:20px; font-weight:700; font-size:17px; }

  /* inicio */
  #home { overflow:hidden; }
  #homeCv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .homeWrap { position:relative; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; display:flex; flex-direction:column; align-items:center; padding-bottom:24px; }
  .topbar { flex:none; width:100%; display:flex; justify-content:space-between; align-items:center; padding:12px 12px 0; gap:6px; }
  .topbar .coins { font-size:15px; padding:5px 10px; white-space:nowrap; }
  .topbar .coins { box-shadow:0 3px 0 rgba(0,0,0,.12); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .topbar .gear { width:42px; height:42px; border-radius:14px; border:0; background:rgba(255,255,255,.6); font-size:20px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .logo { margin:10px 0 2px; display:flex; gap:4px; perspective:400px; flex:none; }
  .logo span { font:700 38px 'Fredoka',sans-serif; color:#fff; width:42px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; position:relative;
    text-shadow:0 3px 0 rgba(0,0,0,.22); box-shadow:inset 0 -7px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.35), 0 6px 14px rgba(0,0,0,.18);
    background-image:radial-gradient(circle at 26% 14%, rgba(255,255,255,.45) 0 9%, transparent 10%), radial-gradient(circle at 74% 14%, rgba(255,255,255,.45) 0 9%, transparent 10%);
    animation:drop .7s cubic-bezier(.3,1.6,.5,1) backwards, bob 2.6s ease-in-out infinite; cursor:pointer; }
  .logo span.jig { animation:jig .45s; }
  @keyframes drop { from { transform:translateY(-140px) rotate(-25deg); opacity:0; } }
  @keyframes bob { 50%{ transform:translateY(-6px) rotate(-2deg) } }
  @keyframes jig { 25%{ transform:scale(1.25,.8) } 60%{ transform:scale(.9,1.15) translateY(-10px) } }
  .tagline { font-size:15px; opacity:.8; margin-bottom:10px; font-weight:500; flex:none; }
  .hero { flex:none; width:min(380px,92vw); background:rgba(255,255,255,.42); border-radius:26px; padding:14px 16px 16px; box-shadow:0 8px 24px rgba(40,40,80,.15), inset 0 1px 0 rgba(255,255,255,.7);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:flex; flex-direction:column; gap:8px; }
  .heroTop { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; font-weight:600; }
  .heroTop > div:first-child { flex:1; min-width:0; }
  #heroPct { white-space:nowrap; font-weight:700; }
  .heroTop .wn { font-size:13px; opacity:.7; }
  .heroTop .wt { font-size:20px; font-weight:700; }
  .heroBar { height:10px; background:rgba(0,0,0,.1); border-radius:6px; overflow:hidden; }
  .heroBar div { height:100%; background:linear-gradient(90deg,#55c41b,#a8f05a); border-radius:6px; transition:width .6s; }
  #bPlay { width:100%; height:68px; font-size:26px; border-radius:20px; position:relative; overflow:hidden; flex-direction:column; line-height:1.05; box-shadow:0 6px 0 #2f8a0a, 0 10px 24px rgba(85,196,27,.45); animation:glow 2.2s ease-in-out infinite; }
  #bPlay small { font-size:14px; opacity:.9; font-weight:500; }
  #bPlay::after { content:''; position:absolute; top:0; bottom:0; width:60px; left:-80px; background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); animation:shine 3s ease-in-out infinite; }
  @keyframes shine { 0%,55% { left:-80px; } 100% { left:110%; } }
  @keyframes glow { 50% { box-shadow:0 6px 0 #2f8a0a, 0 10px 34px rgba(85,196,27,.75); } }
  .modes { flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:min(380px,92vw); margin:12px 0 10px; }
  .mode { border:0; border-radius:20px; padding:10px 6px; color:#fff; font:700 15px 'Fredoka',sans-serif; text-align:center; cursor:pointer; position:relative; min-height:96px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-shadow:0 2px 0 rgba(0,0,0,.15); animation:float 4s ease-in-out infinite; }
  .mode::before { content:''; position:absolute; right:-18px; top:-18px; width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.14); }
  .mode:active { transform:translateY(3px) scale(.98); }
  @keyframes float { 50% { transform:translateY(-3px); } }
  .mode .ic { font-size:21px; line-height:1; width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -3px 0 rgba(0,0,0,.1); }
  .mode small { font-size:11.5px; font-weight:500; opacity:.95; line-height:1.15; }
  .mode.locked { filter:grayscale(1) brightness(1.1); opacity:.65; animation:none; }
  .dock { flex:none; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(380px,92vw); margin:6px 0 10px; background:rgba(255,255,255,.42); border-radius:24px; padding:8px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 24px rgba(40,40,80,.15); }
  .dock button { border:0; background:transparent; font:600 11.5px 'Fredoka',sans-serif; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border-radius:16px; }
  .dock button span { font-size:24px; width:44px; height:44px; border-radius:14px; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .dock button:active span { transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.12); }
  .pausebox { display:flex; justify-content:center; gap:10px; margin-bottom:14px; }
  .pausebox button { width:56px; height:46px; border-radius:14px; border:0; font-size:22px; background:#e3e5ef; }
  .pausebox button.off { opacity:.4; }

  /* listas */
  .listwrap { flex:1; overflow-y:auto; padding:10px 14px 30px; touch-action:pan-y; }
  .hdrTitle { font-size:24px; font-weight:700; flex:1; text-align:center; }
  .world { border-radius:20px; padding:14px 16px; margin-bottom:12px; color:#fff; display:flex; align-items:center; gap:12px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.18); }
  .world .wn { font-size:13px; opacity:.88; }
  .world .wt { font-size:22px; font-weight:700; }
  .world .wm { font-size:13px; opacity:.95; margin-top:2px; }
  .world .wbar { height:8px; background:rgba(255,255,255,.35); border-radius:4px; margin-top:6px; overflow:hidden; }
  .world .wbar div { height:100%; background:#fff; }
  .world .ws { margin-left:auto; text-align:right; font-weight:600; white-space:nowrap; }
  .world.locked { filter:grayscale(.9); opacity:.6; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .grid button { aspect-ratio:1; border:0; border-radius:14px; font:700 19px 'Fredoka',sans-serif; background:#ff4fa3; color:#fff; box-shadow:0 4px 0 #c22a73; cursor:pointer; position:relative; padding:0; }
  .grid button.done { background:#55c41b; box-shadow:0 4px 0 #2f8a0a; }
  .grid button.skipped { background:#8b90aa; box-shadow:0 4px 0 #5d6178; }
  .grid button.cur { outline:3px solid #fff; outline-offset:2px; }
  .grid button.locked { background:#c9ccdb; box-shadow:0 4px 0 #9a9eb6; color:#8e92ab; }
  .grid button small { position:absolute; bottom:2px; left:0; right:0; font-size:10px; letter-spacing:1px; color:#ffe680; }
  .dcard { background:#f4f5fb; border-radius:20px; padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; box-shadow:0 5px 0 #8b90aa; cursor:pointer; }
  .dcard .dn { font-size:19px; font-weight:700; }
  .dcard .dd { font-size:14px; opacity:.7; }
  .dcard .chk { margin-left:auto; font-size:26px; white-space:nowrap; }
  .dcard.dim { opacity:.55; }
  .bigstat { text-align:center; margin:6px 0 16px; font-size:17px; }
  .bigstat b { font-size:40px; display:block; line-height:1.1; }
  .tabs { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0 14px; }
  .tabs button { border:0; border-radius:14px; padding:7px 12px; font:600 16px 'Fredoka',sans-serif; background:rgba(255,255,255,.45); color:var(--ink); }
  .tabs button.on { background:#3a3d52; color:#fff; }
  .statrow { display:flex; justify-content:space-between; padding:12px 6px; border-bottom:1px solid rgba(0,0,0,.08); font-size:17px; }
  .statrow b { font-weight:700; }
  .skinprev { width:72px; height:48px; border-radius:10px; flex:none; }

  /* editor */
  #edTools { display:none; padding:6px 8px 10px; }
  #game.editing #edTools { display:block; }
  #game.editing .playonly { display:none !important; }
  #game:not(.editing) .editonly { display:none !important; }
  .edrow { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:6px; }
  .edrow.tl { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .tool { border:0; border-radius:12px; min-width:0; height:44px; font:600 11px 'Fredoka',sans-serif; background:#eef0f8; color:var(--ink); box-shadow:0 3px 0 #8b90aa; padding:0 2px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; }
  .tool span { font-size:17px; }
  .tool.on { background:#3a3d52; color:#fff; box-shadow:0 3px 0 #23253a; }
  .swatch { width:32px; height:32px; border-radius:10px; border:3px solid transparent; box-shadow:0 3px 0 rgba(0,0,0,.2); }
  .swatch.on { border-color:#fff; outline:2px solid #3a3d52; }
  .sizebox { display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.5); border-radius:12px; padding:2px 6px; font-weight:600; font-size:14px; }
  .sizebox button { border:0; background:#3a3d52; color:#fff; width:26px; height:26px; border-radius:8px; font-size:16px; }

  /* modales */
  .overlay { position:fixed; inset:0; background:rgba(40,42,60,.55); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .overlay.show { display:flex; animation:fade .25s; }
  .card { background:#f4f5fb; border-radius:26px; padding:24px 20px 20px; text-align:center; width:min(360px,100%); box-shadow:0 10px 0 #7d829e; animation:pop .35s cubic-bezier(.2,1.6,.4,1); max-height:90vh; overflow:auto; touch-action:pan-y; }
  @keyframes pop { from{transform:scale(.7)} }
  .card h2 { margin:0 0 6px; font-size:29px; }
  .card p { margin:4px 0 16px; font-size:17px; opacity:.88; line-height:1.35; }
  .card .ic { font-size:56px; margin-bottom:4px; line-height:1.1; }
  .card .btns { display:flex; flex-direction:column; gap:12px; align-items:center; }
  .stars { font-size:44px; letter-spacing:6px; margin:4px 0 8px; }
  .stars span { color:#c9ccdb; display:inline-block; }
  .stars span.on { color:#ffc21a; text-shadow:0 3px 0 #d98a00; animation:star .5s backwards; }
  @keyframes star { from{transform:scale(0) rotate(-90deg)} }
  .chest { font-size:90px; display:inline-block; animation:shakeC .5s 3; }
  @keyframes shakeC { 25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)} }
  .toggle { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; font-size:18px; border-bottom:1px solid #dde0ec; }
  .toggle button { width:60px; height:34px; border-radius:17px; border:0; background:#c9ccdb; position:relative; cursor:pointer; }
  .toggle button::after { content:''; position:absolute; top:4px; left:4px; width:26px; height:26px; border-radius:13px; background:#fff; transition:left .2s; }
  .toggle button.on { background:#55c41b; }
  .toggle button.on::after { left:30px; }
  .mech { width:120px; height:90px; margin:0 auto 6px; display:block; }

  /* ---- tanda 1 de añadidos ---- */
  body.dark { --ink:#e8e9f4; background:linear-gradient(#2a2c40,#17182a) !important; }
  body.dark .card, body.dark .dcard { background:#2c2f44; color:#e8e9f4; box-shadow:0 10px 0 #15172a; }
  body.dark .dcard { box-shadow:0 5px 0 #15172a; }
  body.dark .btn.light { background:#3c4058; color:#e8e9f4; box-shadow:0 4px 0 #1c1e30; }
  body.dark .hero, body.dark .dock { background:rgba(30,32,50,.55); }
  body.dark .dock button span, body.dark .topbar .gear { background:#3c4058; }
  body.dark .coins, body.dark #gSub span { background:rgba(30,32,50,.6); color:#e8e9f4; }
  body.dark .statrow { border-color:rgba(255,255,255,.08); }
  body.dark .toggle { border-color:#3c4058; }
  body.dark .code { background:#1f2134; color:#e8e9f4; }
  body.lefty #game header { flex-direction:row-reverse; }
  body.bigtext .card p, body.bigtext .dd, body.bigtext .mode small, body.bigtext .statrow, body.bigtext #hint { font-size:19px !important; }
  body.bigtext #gSub { font-size:18px; }
  body.bigtext .dn { font-size:22px; }
  .chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:10px; flex:none; }
  .chip { border:0; border-radius:16px; padding:7px 12px; font:600 14px 'Fredoka',sans-serif; background:rgba(255,255,255,.6); color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.12); position:relative; }
  .chip .dot { position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:6px; background:#ff4fa3; }
  body.dark .chip { background:rgba(30,32,50,.6); }
  body.dark .tabs button { background:rgba(60,64,88,.8); color:#e8e9f4; } body.dark .tabs button.on { background:#e8e9f4; color:#2a2c40; }
  body.dark .hdrTitle, body.dark #gTitle { color:#e8e9f4; }
  .lvbadge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.55); padding:4px 10px 4px 4px; border-radius:20px; font-weight:700; font-size:14px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .lvbadge b { width:30px; height:30px; border-radius:15px; background:conic-gradient(#55c41b var(--p), rgba(0,0,0,.12) 0); display:flex; align-items:center; justify-content:center; position:relative; }
  .lvbadge b::before { content:''; position:absolute; inset:4px; border-radius:50%; background:#fff; }
  .lvbadge b span { position:relative; font-size:13px; }
  body.dark .lvbadge { background:rgba(30,32,50,.6); } body.dark .lvbadge b::before { background:#2c2f44; }
  .mbar { height:8px; border-radius:4px; background:rgba(0,0,0,.1); overflow:hidden; margin-top:6px; }
  .mbar div { height:100%; background:linear-gradient(90deg,#ffc21a,#ff7a1a); }
  .stk { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:8px 0 16px; }
  .stk div { aspect-ratio:1; border-radius:12px; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; font-size:26px; box-shadow:0 3px 0 rgba(0,0,0,.1); }
  .stk div.no { filter:grayscale(1) brightness(1.6); opacity:.35; }
  body.dark .stk div { background:rgba(60,64,88,.8); }
  .skinprev.wide { width:96px; height:56px; }
  #mascot { position:absolute; left:8px; bottom:6px; font-size:34px; z-index:3; pointer-events:none; transition:transform .2s; filter:drop-shadow(0 3px 2px rgba(0,0,0,.2)); }
  #mascot.jump { animation:mjump .5s; }
  #mascot.dance { animation:mdance .4s 4; }
  #mascot.sad { transform:rotate(-12deg) scale(.95); }
  @keyframes mjump { 40% { transform:translateY(-22px) scale(1.1,.9); } }
  @keyframes mdance { 25% { transform:rotate(-15deg) translateY(-8px); } 75% { transform:rotate(15deg) translateY(-8px); } }

  if (!G || G.mode === 'edit') { if (G && G.mode === 'edit') $('gTitle').querySelector('.lv').textContent = G.title; return; }
  const left = blocks.filter(b => !b.out).length;
  $('gTitle').querySelector('.lv').textContent = G.title;
  let sub = '';
  if (G.timer) sub = Math.max(0, Math.ceil(G.time)) + ' s · ' + G.score + (G.score === 1 ? ' nivel' : ' niveles');
  else if (G.limit) sub = 'Movimientos ' + moves + ' / ' + G.limit;
  else if (G.mode === 'zen') sub = 'Quedan ' + left;
  else sub = moves + (moves === 1 ? ' movimiento' : ' movimientos') + ' · quedan ' + left;
  const se = $('gSub'); se.innerHTML = '<span>' + sub + '</span>';
  se.classList.toggle('warn', !!(G.limit && moves >= G.limit) || !!(G.timer && G.time < 10));
  $('bUndo').disabled = !history.length;
  $('bHint').style.display = (G.timer || G.noHelp) ? 'none' : '';
  $('bUndo').style.display = $('bReset').style.display = G.noHelp ? 'none' : '';
  $('hintBadge').textContent = G.freeHints ? '∞' : (S.hints > 0 ? S.hints : '🪙');

}

const HOME = { cv: $('homeCv'), blocks: [], parts: [], t: 0, next: 2, W: 0, H: 0, dpr: 1, sprites: {}, skin: null };
const HC = 34;
function homeResize() {

function homeSprite(w, h, c) {

}
function homeSpawn(initial) {
  const sh = [[1, 1], [1, 2], [2, 1], [2, 2], [1, 3], [3, 1], [2, 3]][Math.floor(Math.random() * 7)];
  const sc = 0.7 + Math.random() * 0.6;
  return { w: sh[0], h: sh[1], c: Math.random() < 0.08 ? 8 : Math.floor(Math.random() * 8), sc,
    x: Math.random() * HOME.W, y: initial ? Math.random() * HOME.H : HOME.H + 120, vy: -(18 + Math.random() * 26) * (1.4 - sc * 0.5),
    ph: Math.random() * 6, rot: (Math.random() - 0.5) * 0.6, vr: (Math.random() - 0.5) * 0.3, alpha: 0.55 + sc * 0.3, pop: initial ? 1 : 0 };
}
function homeBurst(b) {

  const cx = b.x, cy = b.y, n = 6 + b.w * b.h * 3;
  for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2 + Math.random() * 0.4; emitBreak(S.skin || 'clasico', HOME.parts, cx + Math.cos(a) * b.w * cell * 0.3, cy + Math.sin(a) * b.h * cell * 0.3, Math.cos(a), Math.sin(a), b.c, k, cell * 0.5); }

}
function homeBurstAt(px, py, c, n) {

}

    const b = HOME.blocks[i], W = b.w * HC * b.sc, H = b.h * HC * b.sc;

function homeFrame(dt) {
  if (!HOME.W) homeResize();
  if (!HOME.blocks.length) for (let i = 0; i < 11; i++) HOME.blocks.push(homeSpawn(true));
  HOME.t += dt; HOME.next -= dt;
  for (const b of HOME.blocks) { b.y += b.vy * dt; b.ph += dt; b.rot += b.vr * dt * 0.3; b.x += Math.sin(b.ph * 0.8) * 8 * dt; if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 2); }

  if (HOME.next <= 0) {
    // de vez en cuando una pieza estalla sola para lucir el material
    HOME.next = 1.8 + Math.random() * 2.2;
    const cands = HOME.blocks.filter(b => b.y > HOME.H * 0.15 && b.y < HOME.H * 0.85);
    if (cands.length) { const b = cands[Math.floor(Math.random() * cands.length)]; homeBurst(b); HOME.blocks[HOME.blocks.indexOf(b)] = homeSpawn(false); }
  }
  seasonFrame(dt);
  stepParticles(HOME.parts, dt); HOME.parts = HOME.parts.filter(p => p.life > 0 && p.y < HOME.H + 40);
  const c = HOME.cv.getContext('2d'); c.setTransform(HOME.dpr, 0, 0, HOME.dpr, 0, 0); c.clearRect(0, 0, HOME.W, HOME.H);
  for (const b of [...HOME.blocks].sort((a, b) => a.sc - b.sc)) {
    const W = b.w * HC * b.sc, H = b.h * HC * b.sc, s = easeBack(clamp(b.pop, 0, 1));

}

function taLevel(n, rng) {

}

function todayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dailyLevel(k, slot) {
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const rng = mulberry(h + slot * 1013);
  const ranges = [[0.1, 0.36], [0.36, 0.7], [0.7, 1]];
  const a = Math.floor(ranges[slot][0] * NLV), z = Math.max(a + 1, Math.floor(ranges[slot][1] * NLV));
  return variant(LEVELS[Math.min(NLV - 1, a + Math.floor(rng() * (z - a)))], rng);
}

function startDaily(s) {

    onExit: openDaily,

window.addEventListener('keydown', e => {
  const modal = $('modal').classList.contains('show');
  if (e.target && /TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (modal) { if (e.key === 'Enter') { const b = $('modalCard').querySelector('.btns .btn'); b && b.click(); } return; }
  if ($('game').classList.contains('show') && G && G.mode !== 'edit') {
    if ((e.key === 'z' || e.key === 'Z') || (e.key === 'z' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); if (!G.noHelp) undo(); }
    else if (e.key === 'r' || e.key === 'R') $('bReset').click();
    else if (e.key === 'h' || e.key === 'H') { if (!G.noHelp) useHint(); }
    else if (e.key === 'Escape') openPause();
  } else if ($('home').classList.contains('show') && e.key === 'Enter') $('bPlay').click();
});

// ---------------- arranque de los añadidos ----------------
function initExtras() {
  applyLook();
  $('bMissions').onclick = () => { sfx.click(); openMissions(); };
  $('chipMis').onclick = () => { sfx.click(); openMissions(); };
  $('chipStreak').onclick = () => { sfx.click(); showModal({ icon: '🔥', title: 'Racha de victorias', text: 'Llevas <b>' + S.streak + '</b> niveles seguidos sin abandonar ninguno (tu mejor marca: ' + S.bestStreak + '). Cada 5 ganas monedas extra. Si sales de un nivel a medias o lo saltas, la racha vuelve a cero.', buttons: [{ label: 'Vale', cls: 'go' }] }); };
  $('lvBadge').onclick = () => { sfx.click(); const xl = xpLevel(S.xp); showModal({ icon: '⭐', title: 'Nivel ' + xl.lvl + ' · ' + titleFor(xl.lvl), text: xl.cur + ' / ' + xl.need + ' XP para el siguiente nivel.<br>Ganas experiencia en todos los modos y cobrando misiones. Cada nivel de jugador da monedas, y cada 5 niveles cambia tu título.', buttons: [{ label: 'Vale', cls: 'go' }] }); };
  if (!MODES.find(m => m.id === 'retos')) MODES.push({ id: 'retos', ic: '⚔️', name: 'Retos', desc: 'Semanal y más', col: '#f2384a', req: 50 });
  const sTag = season(); if (sTag) document.querySelector('.tagline').textContent = SEASON[sTag].tag;
  setTimeout(() => { const ld = $('loader'); ld.classList.add('hide'); setTimeout(() => ld.remove(), 600); }, 700);
  openSharedLink();
}
// ================= arranque =================
initExtras();
show('home');
initCloud();
requestAnimationFrame(t => { last = t; frameLoop(t); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); warm(); });
setInterval(() => { if (G && G.mode !== 'edit' && $('game').classList.contains('show')) save(); }, 30000);

if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname.endsWith('github.io')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
